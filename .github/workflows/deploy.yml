name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master, claude/home-sales-tracker-4Ik7H ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout healthcare app (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: healthcare

      - name: Checkout home sales tracker
        uses: actions/checkout@v4
        with:
          ref: claude/home-sales-tracker-4Ik7H
          path: tracker

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build healthcare app
        working-directory: healthcare
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /Claude-example/

      - name: Install & build home sales tracker
        working-directory: tracker
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /Claude-example/tracker/

      - name: Combine builds
        run: |
          mkdir -p combined
          cp -r healthcare/dist/. combined/
          mkdir -p combined/tracker
          cp -r tracker/dist/. combined/tracker/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
